name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -e ".[gui,dev]"
      - name: Check native solver imports
        run: python -c "import cvxpy, osqp; print('CVXPY', cvxpy.__version__, 'OSQP', osqp.__version__)"
      - run: python -m ruff check src tests tools
      - run: python -m pytest -q
      - run: python tools/check_release.py
      - run: python -m build
      - run: python tools/check_release.py --artifacts dist
      - name: Test installed wheel outside checkout
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          subprocess.check_call([sys.executable, '-m', 'pip', 'uninstall', '-y', 'eis-fitter'])
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheel)])
          tests = pathlib.Path('tests').resolve()
          with tempfile.TemporaryDirectory() as directory:
              for command in [['eis-fit', '--help'], ['eis-fit-gui', '--help']]:
                  subprocess.check_call(command, cwd=directory)
              subprocess.check_call([sys.executable, '-m', 'pytest', '-q', str(tests)], cwd=directory)
